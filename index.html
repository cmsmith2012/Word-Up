<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Up"><title>Word Up — Level up your Scripture game.</title>
<style>
:root{--bg:#f6f2e9;--card:#fffdf8;--ink:#20201d;--muted:#78736a;--line:#e5dfd3;--orange:#c46b35;--green:#64745c;--dark:#171717;--soft:#eee8dc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;padding-bottom:80px}.app{max-width:760px;margin:auto;min-height:100vh}
header{position:sticky;top:0;z-index:10;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:#f6f2e9ee;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:29px;font-weight:900;letter-spacing:-.055em}.tag{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}.head button{border:0;background:var(--card);border-radius:15px;width:43px;height:43px;font-size:19px}
main{padding:18px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--orange)}h1{font:35px Georgia,serif;line-height:1.05;margin:7px 0}.hero{padding:7px 2px 17px}.hero p{color:var(--muted);line-height:1.55;margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:23px;padding:20px;margin-bottom:14px;box-shadow:0 12px 34px #231e1414}.ref{font-size:11px;font-weight:900;letter-spacing:.13em;color:var(--green)}.verse{font:24px/1.58 Georgia,serif;margin:9px 0 17px}.tap{border-bottom:2px dotted #cfc5b5}.actions{display:grid;grid-template-columns:1.25fr 1fr;gap:9px}.btn{border:1px solid var(--line);background:#f8f4ec;border-radius:14px;padding:12px 10px;font-size:13px;font-weight:800}.primary{background:var(--dark);color:white!important;border-color:var(--dark)}.section{font-size:12px;font-weight:900;margin:22px 2px 9px}.mini{display:flex;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}.mini:last-child{border-bottom:0}.num{width:34px;height:34px;flex:none;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:11px;font-weight:900}.mini b{font:16px Georgia,serif}.mini span{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:3px}
nav{position:fixed;z-index:20;bottom:0;left:0;right:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#fffdf8f5;backdrop-filter:blur(20px);border-top:1px solid var(--line)}.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:none;color:var(--muted);font-size:10px;font-weight:800;padding:6px 2px}.nav button.active{color:var(--ink)}.nav i{display:block;font-style:normal;font-size:19px;margin-bottom:2px}
.sheet{position:fixed;inset:0;z-index:50;background:#14120f66;display:none;align-items:flex-end}.sheet.open{display:flex}.panel{width:100%;max-width:760px;max-height:91vh;overflow:auto;background:var(--card);border-radius:29px 29px 0 0;padding:11px 20px calc(28px + env(safe-area-inset-bottom))}.handle{width:42px;height:5px;border-radius:9px;background:#d8d0c2;margin:0 auto 15px}.close{float:right;border:0;background:var(--soft);border-radius:50%;width:35px;height:35px;font-size:20px}.panel h2{font:30px Georgia,serif}.panel h3{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--green);margin:25px 0 7px}.panel p{line-height:1.65;color:#4c4943}.quote{font:20px/1.5 Georgia,serif!important;color:var(--ink)!important}.lens{display:grid;grid-template-columns:1fr 1fr;gap:9px}.lens div{background:#f6f1e8;border-radius:15px;padding:13px}.lens b{display:block;font-size:10px;color:var(--green);margin-bottom:5px}.lens span{font-size:12px;line-height:1.4;color:var(--muted)}.pills{display:flex;gap:7px;overflow:auto}.pill{border:1px solid var(--line);font-family:inherit;white-space:nowrap;background:#f5f0e6;border:1px solid var(--line);border-radius:99px;padding:8px 11px;font-size:11px;font-weight:800}.topic{border:1px solid var(--line);background:var(--card);border-radius:21px;padding:18px;margin-bottom:12px;cursor:pointer}.topic b{display:block;font:20px Georgia,serif;margin:5px 0}.topic span{font-size:12px;color:var(--muted);line-height:1.45}.search input{width:100%;padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--card);font-size:15px}.empty{text-align:center;color:var(--muted);padding:45px 10px}
</style></head><body><div class="app">
<header><div class="head"><div><div class="brand">Word Up</div><div class="tag">Level up your Scripture game.</div></div><button onclick="study(current)">✦</button></div></header>
<main id="main"></main>
<nav><div class="nav">
<button class="active" onclick="tab('read',this)"><i>📖</i>Read</button><button onclick="tab('discover',this)"><i>🧭</i>Discover</button><button onclick="tab('words',this)"><i>🇬🇷</i>Words</button><button onclick="tab('search',this)"><i>⌕</i>Search</button><button onclick="tab('saved',this)"><i>🔖</i>Saved</button>
</div></nav></div>
<div class="sheet" id="sheet" onclick="if(event.target.id==='sheet')closeSheet()"><section class="panel"><div class="handle"></div><button class="close" onclick="closeSheet()">×</button><div id="panel"></div></section></div>
<script>
const v=[
{r:"Genesis 1:1",t:"In the beginning God created the heavens and the earth.",a:"Genesis does not name its human author. Jewish and Christian tradition has associated Genesis with Moses, while modern scholarship commonly sees the book as the result of a long process involving older traditions. Word Up will distinguish tradition, evidence, and scholarly debate.",u:"Genesis was preserved for Israel. Its opening establishes foundational truths about God, creation, humanity, and God's purposes. Israel's ancient audience also lived among competing creation traditions.",b:"Genesis opens the Bible by putting God before everything else. Creation begins with the sovereign God who creates and orders the world.",l:"Genesis 1:1 introduces the creation account of chapters 1–2. The repeated pattern of God speaking and creation responding shapes the chapter.",h:"Genesis speaks into the ancient Near Eastern world. Its precise date and compositional history are debated, so Word Up will present major proposals alongside the traditional view.",c:"Ancient Near Eastern cultures had stories about gods, cosmic waters, and creation. Genesis uses familiar imagery while making a radically different claim about one sovereign Creator.",g:"God is the source and ruler of creation. The verse begins the Bible's larger story about God's relationship with the world he made.",x:"bereshit — 'in the beginning'; bara — 'created'; Elohim — 'God.' Context determines how these Hebrew terms function here.",q:"John 1:1–3 • Psalm 33:6–9 • Colossians 1:15–17"},
{r:"Genesis 1:2",t:"The earth was empty and formless, and darkness covered the deep waters. And the Spirit of God was hovering over its surface.",a:"Genesis does not identify its human author by name. Traditional attribution and modern theories about composition should be kept distinct.",u:"The Israelite audience would have recognized imagery of primordial waters and cosmic disorder from the ancient world around them.",b:"Before ordered creation, Genesis presents an unformed world—yet God is already present.",l:"Verse 2 sets the stage for the acts of ordering and filling that follow.",h:"The imagery fits the ancient Near Eastern environment in which Genesis was preserved.",c:"The deep is not a rival deity God must defeat; the waters remain under God's authority.",g:"God's Spirit is present at the beginning of creation, contributing to Scripture's recurring picture of God's life-giving presence.",x:"ruach can mean 'spirit,' 'wind,' or 'breath.' Context is essential.",q:"Psalm 104:30 • John 3:5–8 • 2 Corinthians 3:17"},
{r:"Genesis 1:3",t:"Then God said, 'Let there be light,' and there was light.",a:"The human author is not named within Genesis. Traditional Mosaic attribution and modern compositional theories will be presented separately.",u:"Israel's audience heard this in a world where natural forces and heavenly bodies could be associated with deities. Genesis places them under one God's command.",b:"God creates through his word. He speaks, and creation responds.",l:"This begins the repeated pattern of divine speech and fulfillment that structures Genesis 1.",h:"Ancient creation accounts often personified or deified nature. Genesis places creation under God's authority.",c:"Light carried symbolic significance, but Genesis first presents it as something God commands into existence.",g:"Divine speech is powerful and purposeful. Light becomes a major biblical image for revelation and salvation.",x:"The Hebrew wording emphasizes God's speech followed by fulfillment.",q:"Psalm 33:9 • John 1:4–9 • 2 Corinthians 4:6"}];
let current=+localStorage.getItem('wu-current')||0,saved=JSON.parse(localStorage.getItem('wu-saved')||'[]');
function save(){localStorage.setItem('wu-current',current);localStorage.setItem('wu-saved',JSON.stringify(saved))}
function pick(i){current=i;save();render();window.scrollTo(0,0)}
function render(){let z=v[current],words=z.t.replace(/([A-Za-z]+)/g,m=>["beginning","created","God"].includes(m.replace(/[.,'"]/g,''))?`<span class="tap" onclick="word('${m.replace(/[.,'"]/g,'')}')">${m}</span>`:m);main.innerHTML=`<div class="hero"><div class="eyebrow">Read</div><h1>Genesis ${z.r.split(':')[0].split(' ')[1]}</h1><p>Slow down. Read the text. Then go deeper.</p></div><div class="card"><div class="ref">${z.r}</div><div class="verse">${words}</div><div class="actions"><button class="btn primary" onclick="study(${current})">Deep Study</button><button class="btn" onclick="toggle()">🔖 ${saved.includes(current)?'Saved':'Save'}</button></div></div><div class="section">Keep reading</div><div class="card">${v.map((x,i)=>`<div class="mini" onclick="pick(${i})"><div class="num">${i+1}</div><div><b>${x.r}</b><span>${x.t}</span></div></div>`).join('')}</div>`}
function toggle(){saved.includes(current)?saved=saved.filter(x=>x!==current):saved.push(current);save();render()}
function openSheet(){document.getElementById('sheet').classList.add('open')}function closeSheet(){document.getElementById('sheet').classList.remove('open')}

function study(i){current=i;let z=v[i];panel.innerHTML=`<div class="eyebrow">${z.r}</div><h2>Deep Study</h2><div class="pills"><button class="pill" onclick="studySection('meaning')">Meaning</button><button class="pill" onclick="studySection('context')">Context</button><button class="pill" onclick="studySection('history')">History</button><button class="pill" onclick="studySection('culture')">Culture</button><button class="pill" onclick="studySection('language')">Language</button><button class="pill" onclick="studySection('theology')">Theology</button></div><h3>Scripture</h3><p class="quote">${z.t}</p><h3 id="study-author">Author</h3><p>${z.a}</p><h3 id="study-audience">Audience</h3><p>${z.u}</p><h3 id="study-meaning">The Big Idea</h3><p>${z.b}</p><h3 id="study-context">Literary Context</h3><p>${z.l}</p><h3 id="study-history">Historical Context</h3><p>${z.h}</p><h3 id="study-culture">Cultural Context</h3><p>${z.c}</p><h3 id="study-language">Original Language</h3><p>${z.x}</p><h3 id="study-theology">Theology</h3><p>${z.g}</p><h3>Connect It</h3><p>${z.q}</p>`;openSheet()}
function studySection(type){const ids={meaning:'study-meaning',context:'study-context',history:'study-history',culture:'study-culture',language:'study-language',theology:'study-theology'};const id=ids[type];const el=document.getElementById(id);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.style.color='var(--orange)';setTimeout(()=>el.style.color='',700)}}
function word(w){let d={beginning:["בְּרֵאשִׁית","bereshit","Hebrew • H7225","Often rendered 'in the beginning.' Its semantic range is broader than a single English gloss."],created:["בָּרָא","bara","Hebrew • H1254","A Hebrew verb associated with God's creative activity; here God is the subject."],God:["אֱלֹהִים","Elohim","Hebrew","A designation for God; in Genesis 1 God is the grammatical subject of creation."]}[w];if(!d)return;panel.innerHTML=`<div class="eyebrow">Word Study</div><h2>${w}</h2><div class="card"><div style="font:25px Georgia,serif">${d[0]}</div><small>${d[1]} • ${d[2]}</small><p>${d[3]}</p></div><h3>Why it matters here</h3><p>Word Up connects original-language data to the actual verse instead of treating a dictionary definition as the meaning in every passage.</p>`;openSheet()}
function tab(type,el){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(type==='read'){render();return}if(type==='discover'){main.innerHTML=`<div class="hero"><div class="eyebrow">Discover</div><h1>Go deeper.</h1><p>Explore the Bible beyond the page—people, places, culture, history, theology, and the world behind the text.</p></div><div class="topic" onclick="study(0)">📜<b>Why does Genesis begin this way?</b><span>Explore creation, ancient Near Eastern context, and the opening movement of the biblical story.</span></div><div class="topic">🏛️<b>The Biblical World</b><span>People, places, politics, customs, geography, worship, and daily life.</span></div><div class="topic">✝️<b>Theology Deep Dives</b><span>Trace major biblical themes from Genesis to Revelation.</span></div><div class="topic">🗺️<b>People & Places</b><span>Meet the people and see the places that make Scripture come alive.</span></div>`}else if(type==='words'){main.innerHTML=`<div class="hero"><div class="eyebrow">Words</div><h1>Get into the text.</h1><p>Tap an underlined word while reading, or explore important Hebrew and Greek words.</p></div><div class="card">${[['beginning','bereshit','“in the beginning”'],['created','bara','“created”'],['God','Elohim','“God”']].map(x=>`<div class="mini" onclick="word('${x[0]}')"><div class="num">א</div><div><b>${x[1]}</b><span>${x[2]} • Hebrew</span></div></div>`).join('')}</div>`}else if(type==='search'){main.innerHTML=`<div class="hero"><div class="eyebrow">Search</div><h1>Find your rabbit hole.</h1><p>Search verses and study material.</p></div><div class="search"><input id="q" placeholder="Try “creation”, “audience”, or “Genesis 1:1”" oninput="search()"></div><div id="results"></div>`;search()}else{main.innerHTML=saved.length?`<div class="hero"><div class="eyebrow">Your library</div><h1>Saved verses.</h1><p>Your bookmarks live on this device.</p></div><div class="card">${saved.map(i=>`<div class="mini" onclick="pick(${i})"><div class="num">🔖</div><div><b>${v[i].r}</b><span>${v[i].t}</span></div></div>`).join('')}</div>`:`<div class="hero"><div class="eyebrow">Your library</div><h1>Saved.</h1><p>Keep the verses you want to come back to.</p></div><div class="empty">Nothing saved yet.<br>Tap 🔖 while reading.</div>`}}
function search(){let q=(document.getElementById('q')?.value||'').toLowerCase(),r=document.getElementById('results');if(!r)return;let f=v.filter(x=>(x.r+x.t+x.a+x.u+x.b+x.h+x.c+x.g).toLowerCase().includes(q));r.innerHTML=f.length?`<div class="card">${f.map(x=>`<div class="mini" onclick="pick(${v.indexOf(x)})"><div class="num">${x.verse||1}</div><div><b>${x.r}</b><span>${x.t}</span></div></div>`).join('')}</div>`:'<div class="empty">No matches yet.</div>'}
render();
</script></body></html>
